name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only token for every job, whatever the repository default.
permissions:
  contents: read

# The commit gate as independent jobs on separate runners, so the wall clock
# is the slowest job, not the sum. e2e grows with every spec: add an engine or
# configuration to its matrix, or a Playwright --shard axis as floor.yml's
# firefox-146-e2e has, rather than lengthening a job.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npx nx run-many --output-style=static -t lint typecheck

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx nx run-many --output-style=static -t build pack-check

  # The Playwright image carries the three browsers and their system
  # libraries, which an install on the runner took 69s to add.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      # GitHub runs the container as root with HOME owned by the image's
      # pwuser, and Firefox refuses to start as root in another user's home.
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx nx run-many --output-style=static -t test test-storybook

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
        configuration: [development, production]
    name: e2e (${{ matrix.engine }}, ${{ matrix.configuration }})
    env:
      HOME: /root
      FIXTURE_CONFIGURATION: ${{ matrix.configuration }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # e2e depends on ^yeti-build, so Nx builds Yeti before Playwright starts
      # the web servers, whose own Nx processes then hit the cache.
      # The production configuration changes the Fixture app only.
      - run: npx nx run-many --output-style=static -t e2e -p ${{ matrix.configuration == 'production' && 'yeti-app-e2e' || 'yeti-analog-e2e ngx-yeti-e2e yeti-app-e2e' }} -- --project=${{ matrix.engine }}

  safari:
    # Real Safari, as the macOS image ships it (26.6 on every macOS image in
    # September 2026), so the newest image label is as good as any.
    # Playwright cannot drive branded Safari, so only the browser unit tests
    # run here; the WebKit jobs cover stories and e2e.
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      SAFARI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo safaridriver --enable
      # The unit job runs the engine-independent node project.
      - run: npx nx test ngx-yeti -- --project=browser

  # Real screen readers through Guidepup on stories of the static Storybook
  # (apps/screen-reader-e2e). Each runs headed with one worker; the retry
  # budget is in screen-reader.config.mts (2 retries: a check fails after
  # three attempts). The phrase report uploads whether the job passes or
  # fails, so every run records what the reader said.
  voiceover:
    # Pinned, never macos-latest: an image update broke VoiceOver's
    # AppleScript control once (actions/runner-images#11257). VoiceOver reads
    # WebKit's tree in real Safari, through WebdriverIO and safaridriver.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo safaridriver --enable
      - id: guidepup
        run: echo "version=$(node -p "require('@guidepup/guidepup/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/guidepup/
          key: guidepup-voiceover-${{ runner.os }}-${{ steps.guidepup.outputs.version }}
      # Writes the TCC and VoiceOver AppleScript settings the runner needs.
      - run: npx --no-install guidepup setup --ci
      - run: npx --no-install guidepup install voiceover
      - run: npx nx run screen-reader-e2e:voiceover --output-style=static
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screen-reader-voiceover
          path: |
            dist/screen-reader-e2e/
            dist/.playwright/apps/screen-reader-e2e/
          if-no-files-found: warn

  nvda:
    # NVDA reads Chromium's and Gecko's trees, in Playwright's Chromium and
    # Firefox. The nvda target installs NVDA through @guidepup/setup when the
    # cache lacks it.
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: guidepup
        shell: bash
        run: echo "version=$(node -p "require('@guidepup/guidepup/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\guidepup
          key: guidepup-nvda-${{ runner.os }}-${{ steps.guidepup.outputs.version }}
      - run: npx --no-install guidepup setup --ci
      - run: npx playwright install chromium firefox
      - run: npx nx run screen-reader-e2e:nvda --output-style=static
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screen-reader-nvda
          path: |
            dist/screen-reader-e2e/
            dist/.playwright/apps/screen-reader-e2e/
          if-no-files-found: warn
