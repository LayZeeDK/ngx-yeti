name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx prettier --check .
      - run: npx nx run-many -t lint typecheck test test-storybook build
      - run: npx nx run-many -t e2e
      - run: npx nx e2e yeti-app-e2e
        env:
          FIXTURE_CONFIGURATION: production

  safari:
    # Real Safari, as the macOS image ships it (26.6 on every macOS image in
    # September 2026), so the newest image label is as good as any.
    # Playwright cannot drive branded Safari, so only the browser unit tests
    # run here; the WebKit jobs cover stories and e2e.
    runs-on: macos-latest
    env:
      SAFARI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo safaridriver --enable
      - run: npx nx test ngx-yeti
