name: Browser floor

# Layers 2 and 4 at the Baseline 2025 floor of ADR 0002 on every pull request
# and push to main. Safari 26.2 has no runner; Edge 141 is the Chromium 141
# engine.
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

concurrency:
  group: floor-${{ github.ref }}
  cancel-in-progress: true

env:
  CHROME_FLOOR_VERSION: 141.0.7390.54

jobs:
  chromium-141:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install-deps chromium
      - name: Install Chrome for Testing at the floor
        run: |
          path=$(npx --no-install @puppeteer/browsers install "chrome@$CHROME_FLOOR_VERSION" --path "$RUNNER_TEMP/floor" | awk '{print $2}')
          echo "FLOOR_CHROMIUM_PATH=$path" >> "$GITHUB_ENV"
      - run: npx nx run-many -t test e2e -p ngx-yeti ngx-yeti-e2e yeti-app-e2e

  firefox-145:
    runs-on: ubuntu-latest
    env:
      FLOOR_FIREFOX: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install-deps firefox
      # WebdriverIO downloads Firefox 145 and geckodriver itself.
      - run: npx nx test ngx-yeti

  webkit-26-4:
    runs-on: ubuntu-latest
    # Playwright 1.59.1 bundles WebKit 26.4, the earliest label not below
    # Safari 26.2. A Playwright release drives only its own WebKit build, so
    # the job runs in that release's image and installs the same release.
    container: mcr.microsoft.com/playwright:v1.59.1-noble
    env:
      FLOOR_WEBKIT: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.59.1 @playwright/test@1.59.1
      # The Storybook e2e needs mount(storyId), which Playwright 1.62 added.
      - run: npx nx run-many -t test e2e -p ngx-yeti yeti-app-e2e
