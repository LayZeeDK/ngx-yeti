name: Browser floor

# Layers 2 and 4 at the Baseline 2025 floor of ADR 0002 on every pull request
# and every push to main or release/**. Safari 26.2 has no runner; Edge 141
# is the Chromium 141 engine.
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

concurrency:
  group: floor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only token for every job, whatever the repository default.
permissions:
  contents: read

env:
  CHROME_FLOOR_VERSION: 141.0.7390.54

jobs:
  chromium-141:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install-deps chromium
      - name: Install Chrome for Testing at the floor
        # bash adds pipefail, so a failed install fails this step.
        shell: bash
        run: |
          path=$(npx --no-install @puppeteer/browsers install "chrome@$CHROME_FLOOR_VERSION" --path "$RUNNER_TEMP/floor" | awk '{print $2}')
          test -x "$path"
          echo "FLOOR_CHROMIUM_PATH=$path" >> "$GITHUB_ENV"
      # test and e2e depend on ^yeti-build, so Nx builds Yeti before
      # Playwright starts the web servers, whose own Nx processes then hit
      # the cache.
      - run: npx nx test ngx-yeti -- --project=browser
      - run: npx nx run-many --output-style=static -t e2e -p ngx-yeti-e2e yeti-app-e2e

  firefox-145:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLOOR_FIREFOX: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install-deps firefox
      # WebdriverIO downloads Firefox 145 and geckodriver itself.
      # ci.yml's unit job runs the engine-independent node project.
      - run: npx nx test ngx-yeti -- --project=browser

  webkit-26-4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright 1.59.1 bundles WebKit 26.4, the earliest label not below
    # Safari 26.2. A Playwright release drives only its own WebKit build, so
    # the job runs in that release's image and installs the same release.
    container: mcr.microsoft.com/playwright:v1.59.1-noble
    env:
      FLOOR_WEBKIT: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.59.1 @playwright/test@1.59.1
      # test and e2e depend on ^yeti-build, so Nx builds Yeti before
      # Playwright starts the web servers, whose own Nx processes then hit
      # the cache.
      - run: npx nx test ngx-yeti -- --project=browser
      - run: npx nx run-many --output-style=static -t e2e -p ngx-yeti-e2e yeti-app-e2e

  firefox-146-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright's --shard splits each project's tests into the same halves on
    # every run, so the two runners share the suite.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: firefox-146-e2e (${{ matrix.shard }}/2)
    # Playwright 1.58.2 bundles Firefox 146.0.1, the earliest Playwright
    # Firefox not below 145; 1.57 bundles 144. Stock Firefox 145 runs only
    # through WebdriverIO, which covers layer 2 in the firefox-145 job.
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      FLOOR_FIREFOX_E2E: 'true'
      # GitHub runs the container as root with HOME owned by the image's
      # pwuser, and Firefox refuses to start as root in another user's home.
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.58.2 @playwright/test@1.58.2
      # e2e depends on ^yeti-build, so Nx builds Yeti before Playwright starts
      # the web servers, whose own Nx processes then hit the cache.
      # Two workers on the runner's four CPUs: 30% less test time than one,
      # and no more past two, measured in this image at four CPUs.
      - run: npx nx run-many --output-style=static -t e2e -p ngx-yeti-e2e yeti-app-e2e -- --shard=${{ matrix.shard }}/2 --workers=2
