<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Yeti reference</title>
<link rel="stylesheet" href="/yeti/yeti.css" />
<script type="module" src="/yeti/hover.js"></script>
</head>
<body>
<main>
<h1>Variant R</h1>
<!-- x-demo mirrors app-demo-a/b so that sibling spacing is the same as in the app -->
<x-demo>
<!-- Yeti src/components/nav/example.html at f52d1e8b9, verbatim -->
<nav class="nav" aria-label="Site">
	<a href="#" data-brand>Yeti</a>
	<button type="button" popovertarget="site-menu" aria-label="Menu"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
	<ul id="site-menu" popover role="list">
		<li><a href="#" aria-current="page">Docs</a></li>
		<li><a href="#">Blog</a></li>
		<li class="dropdown">
			<button type="button" popovertarget="more-menu">More</button>
			<div id="more-menu" popover>
				<a href="#">Guides</a>
				<a href="#">Components</a>
				<a href="#">Changelog</a>
			</div>
		</li>
		<li><a href="#">About</a></li>
	</ul>
	<div data-actions><a class="button" href="#" data-size="sm">Get started</a></div>
</nav>
<!-- Yeti src/components/dropdown/example.html at f52d1e8b9, verbatim -->
<div class="dropdown">
	<button class="button" type="button" popovertarget="account-menu" data-emphasis="medium">Account</button>
	<div id="account-menu" popover>
		<a href="#">Profile</a>
		<a href="#">Settings</a>
		<button type="button">Sign out</button>
	</div>
</div>
<!-- Yeti src/components/dropdown/docs.md "Opening on hover", verbatim -->
<div class="dropdown" data-trigger="hover">
	<button class="button" type="button" popovertarget="products" data-emphasis="low">Products</button>
	<div id="products" popover>
		<a href="#">Overview</a>
		<a href="#">Pricing</a>
	</div>
</div>
<p><a href="#">After</a></p>
</x-demo>
</main>
</body>
</html>
