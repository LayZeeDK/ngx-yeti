# Ingestion manifest for /gsd-ingest-docs (audit 0005, M4).
#
# The workflow caps one run at 50 documents, so ingestion is split into three runs.
# Each run's `docs` list has the shape `--manifest` expects ({path, type, precedence};
# lower precedence wins). Put one run's `docs` list in a file of its own and pass it:
#   run 1: /gsd-ingest-docs --mode new --manifest <file>
#   runs 2 and 3: /gsd-ingest-docs --mode merge --manifest <file>
# Paths are relative to this bundle's root; the workflow reads them relative to the
# repository root, so prefix each with the folder the bundle is copied into.
#
# Not listed, on purpose: issues/, research/, prototypes/, and audits/ are provenance,
# not requirements (README, Provenance). The directory rules would also take
# audits/NNNN-*.md for ADRs, which the manifest prevents. README.md, map.md, and
# upstream-bugs.md are read by people and agents directly and are not ingested.
# ADR 0005, 0042, and 0060 have points replaced by later ADRs; each records it in a
# dated note in its body, not in its front matter.

runs:
  - run: 1
    mode: new
    # The ADRs and the four cross-cutting documents (35 files)
    docs:
      - path: adr/0001-yeti-licence-compatible-with-mit-package.md
        type: ADR
        precedence: 0
